<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Whiteboard</title>
  <link rel="stylesheet" href="src/content/styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    #logo {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1;
      opacity: 0.6;
      transition: opacity 0.2s;
      pointer-events: none; /* Allow eraser to pass through but still visible */
    }

    #logo:hover {
      opacity: 1;
    }

    #logo.eraser-preview {
      opacity: 0.3; /* Transparency preview when hovering with eraser/quick-delete */
    }

    #logo img {
      width: 24px;
      height: 24px;
    }

    #logo span {
      font-size: 16px;
      font-weight: 600;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="logo">
    <img src="assets/scratch_logo3.png" alt="Scratch">
    <span>Scratch</span>
  </div>

  <script src="whiteboard.js"></script>
  <script src="src/content/content.js"></script>
</body>
</html>
